<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StrukKu" />
  <meta name="description" content="Rekap pengeluaran otomatis lewat foto struk dengan Gemini AI Vision, catat pemasukan cepat, anggaran, dan analitik keuangan." />
  <title>StrukKu — Rekap Keuangan & Scan Struk AI</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top App Header -->
    <header class="app-header">
      <div class="brand-group">
        <img src="./icons/icon.svg" alt="StrukKu" class="brand-logo" />
        <div>
          <div class="brand-title">StrukKu</div>
          <div class="brand-sub">Scan Struk AI &amp; Keuangan</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="month-pill" aria-label="Pilih bulan">
          <button id="btnPrevMonth" title="Bulan sebelumnya" aria-label="Bulan sebelumnya">&#8249;</button>
          <span id="currentMonthLabel">-</span>
          <button id="btnNextMonth" title="Bulan berikutnya" aria-label="Bulan berikutnya">&#8250;</button>
        </div>
        <button id="btnShareApp" class="icon-btn" title="Bagikan Aplikasi" aria-label="Bagikan Aplikasi">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button id="btnThemeToggle" class="icon-btn" title="Ganti Tema" aria-label="Ganti Tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Dynamic Tab Content -->
    <main id="appMain" class="app-main"></main>

    <!-- Bottom Mobile Navigation -->
    <nav class="bottom-nav" aria-label="Navigasi Utama">
      <button class="nav-item active" data-tab="home">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-tab="history">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
        <span>Riwayat</span>
      </button>
      <div class="nav-scan-wrap">
        <button id="btnOpenScanFab" class="nav-scan-btn" title="Foto / Scan Struk" aria-label="Foto atau Scan Struk">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
        <span class="nav-scan-label">Scan Struk</span>
      </div>
      <button class="nav-item" data-tab="analytics">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Analitik</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span>Lainnya</span>
      </button>
    </nav>
  </div>

  <!-- Reusable Bottom Sheet Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modalSheet" class="sheet"></div>
  </div>

  <!-- Hidden File Inputs for Native Mobile Camera & Gallery -->
  <input id="inputCameraFile" type="file" accept="image/*" capture="environment" class="hidden" />
  <input id="inputGalleryFile" type="file" accept="image/*" class="hidden" />
  <input id="inputRestoreJson" type="file" accept="application/json,.json" class="hidden" />

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script defer src="./js/config.js"></script>
  <script defer src="./js/categories.js"></script>
  <script defer src="./js/db.js"></script>
  <script defer src="./js/gemini.js"></script>
  <script defer src="./js/charts.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
